name: Build and Push Docker Image

on:
  push:
    branches: [backend_v2]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lnqvd/connectcard_api_image:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Redeploy stack using pre-created token
        run: |
          curl -k -X POST "https://45.12.255.231:9443/api/stacks/2/redeploy?endpointId=1" \
            -H "Authorization: Bearer ${{ secrets.PORTAINER_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"pullImage\": true, \"prune\": true}"
          echo "Redeploy triggered successfully"

      - name: Check if new image was pushed
        run: |
          curl -s "https://hub.docker.com/v2/repositories/lnqvd/connectcard_api_image/tags/latest/" | jq .digest