name: Build and Push Docker Image

on:
  push:
    branches: [backend_v2]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lnqvd/connectcard_api_image:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Debug auth
        run: |
          echo "Username: ${{ secrets.PORTAINER_USER }}"
          echo "Testing auth..."
          curl -k -v -X POST "https://45.12.255.231:9443/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"Username\":\"${{ secrets.PORTAINER_USER }}\",\"Password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}"

      - name: Get new JWT token
        run: |
          RESPONSE=$(curl -k -s -X POST "https://45.12.255.231:9443/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"Username\":\"${{ secrets.PORTAINER_USER }}\",\"Password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}")
          
          JWT_TOKEN=$(echo $RESPONSE | jq -r '.jwt')
          if [ "$JWT_TOKEN" = "null" ]; then
            JWT_TOKEN=$(echo $RESPONSE | jq -r '.accessToken')
          fi
          
          echo "JWT_TOKEN=$JWT_TOKEN" >> $GITHUB_ENV
          echo "Token obtained successfully"

      - name: Redeploy stack
        run: |
          curl -k -X POST "https://45.12.255.231:9443/api/stacks/2/redeploy?endpointId=1&method=repository" \
            -H "Authorization: Bearer ${{ env.JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"pullImage\": true}"
          echo "Redeploy triggered successfully"