name: Build and Push Docker Image

on:
  push:
    branches: [backend_v2]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: lnqvd/connectcard_api_image:latest 

      # - name: Run tests  
      #   run: |
      #     docker run --rm lnqvd/connectcard_api_image:latest  pytest  # Если есть тесты в коде (рекомендую добавить unit tests с pytest)

  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: lnqvd/connectcard_api_image:latest 

    - name: Get Portainer JWT token
      run: |
        TOKEN=$(curl -s -X POST "https://45.12.255.231:9443/api/auth" \
          -H "Content-Type: application/json" \
          -d "{\"Username\":\"${{ secrets.PORTAINER_USER }}\",\"Password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}" \
          | jq -r '.jwt')
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Redeploy stack
      run: |
        curl -X POST "https://45.12.255.231:9443/api/stacks/your-stack-id/redeploy" \
          -H "Authorization: Bearer ${{ env.TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{\"endpointId\": 1, \"pullImage\": true}"