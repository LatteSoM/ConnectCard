name: Build and Deploy to Portainer

on:
  push:
    branches: [backend_v2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            lnqvd/connectcard_api_image:latest
            lnqvd/connectcard_api_image:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get JWT token from Portainer
        run: |
          RESPONSE=$(curl -k -s -X POST "https://45.12.255.231:9443/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"Username\":\"${{ secrets.PORTAINER_USER }}\",\"Password\":\"${{ secrets.PORTAINER_PASSWORD }}\"}")

          echo "Full response: $RESPONSE"

          JWT_TOKEN=$(echo $RESPONSE | jq -r '.jwt // .access_token // .accessToken')
          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "❌ Failed to obtain JWT token"
            exit 1
          fi

          echo "JWT_TOKEN=$JWT_TOKEN" >> $GITHUB_ENV

      - name: Get current stack definition
        run: |
          STACK=$(curl -k -s \
            -H "Authorization: Bearer ${{ env.JWT_TOKEN }}" \
            "https://45.12.255.231:9443/api/stacks/2")
          
          echo "$STACK" | jq -r '.StackFileContent' > stack.yml

      - name: Update stack with new image tag
        run: |
          NEW_TAG=${{ github.sha }}
          UPDATED_STACK=$(cat stack.yml | jq -Rs .)

          curl -k -X PUT "https://45.12.255.231:9443/api/stacks/2?endpointId=1" \
            -H "Authorization: Bearer ${{ env.JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"stackFileContent\": $UPDATED_STACK,
              \"prune\": true,
              \"env\": [
                {\"name\": \"IMAGE_TAG\", \"value\": \"$NEW_TAG\"}
              ],
              \"pullImage\": true
            }"

          echo "✅ Stack updated with IMAGE_TAG=$NEW_TAG"
